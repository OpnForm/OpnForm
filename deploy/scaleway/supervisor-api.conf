[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
[program:php-fpm]
command=php-fpm -F
stopsignal=QUIT
stopwaitsecs=130
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:nginx]
command=nginx -g "daemon off;"
stopsignal=QUIT
stopwaitsecs=130
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
