[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
[program:worker]
command=php /app/artisan queue:work redis --queue=default --sleep=1 --tries=%(ENV_WORKER_TRIES)s --timeout=3610 --max-time=3600 --memory=512 --no-interaction
numprocs=%(ENV_WORKER_COUNT)s
process_name=worker_%(process_num)02d
stopsignal=TERM
stopwaitsecs=3650
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
