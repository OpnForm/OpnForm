version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.22.1
        - nvm use 24.22.1
        - cd client
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: client/.amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
