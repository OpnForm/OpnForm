version: 2
updates:
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      composer-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      vueuse:
        patterns:
          - "@vueuse/core"
          - "@vueuse/shared"
          - "@vueuse/components"
          - "@vueuse/nuxt"
          - "@vueuse/router"
          - "@vueuse/integrations"
      npm-compatible:
        patterns: ["*"]
        exclude-patterns: ["@vueuse/*", "nuxt-tour", "nuxt-utm"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
