name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "amplify.yml"
      - "api/**"
      - "client/**"
      - "docker/**"
      - "docker-compose*.yml"
      - "scripts/*security*.mjs"
      - "scripts/audit-npm.mjs"
      - "scripts/check-ci-readiness.mjs"
      - "scripts/check-database-compatibility.php"
      - "scripts/check-linux-client-health.mjs"
      - "scripts/check-amplify-runtime.mjs"
      - "scripts/npm-exceptions.json"
      - "scripts/tests/dependency-security.test.mjs"
      - "scripts/docker-setup.sh"
      - "scripts/e2e-*.sh"
      - "scripts/setup-env.sh"
      - "scripts/tests/setup-env-test.sh"
      - "scripts/tests/mcp-draft-preview.test.mjs"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code_lint:
    runs-on: ubuntu-latest
    name: Run code linters

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test Docker environment setup
        run: bash scripts/tests/setup-env-test.sh

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, pdo_mysql, bcmath, gd, zip, pcntl, intl
          tools: composer:v2
          coverage: none

      - name: Prepare the environment
        working-directory: ./api
        run: cp .env.example .env

      - name: Install composer dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts --optimize-autoloader

      - name: Validate Composer platform
        working-directory: ./api
        run: composer check-platform-reqs

      - name: Run PHP lint check
        working-directory: ./api
        run: ./vendor/bin/pint --test

  client_checks:
    runs-on: ubuntu-latest
    name: Run client linters, tests, and build
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install npm dependencies
        run: npm ci --no-audit --no-progress --silent

      - name: Test security audit policy and release gate
        working-directory: .
        run: node --test scripts/tests/dependency-security.test.mjs

      - name: Test MCP draft preview version pinning
        working-directory: .
        run: node --test scripts/tests/mcp-draft-preview.test.mjs

      - name: Run ESLint
        run: npm run lint

      - name: Test integration email event rendering
        run: npm run test:email-events

      - name: Test SSR configuration cache
        run: npm run test:ssr-cache

      - name: Test public form bundle checker
        run: node --test scripts/check-public-form-bundle.test.mjs scripts/check-built-css.test.mjs scripts/check-amplify-output.test.mjs

      - name: Test worktree runtime selection
        working-directory: .
        run: |
          sh scripts/tests/codex-worktree-runtime-test.sh
          sh scripts/tests/codex-worktree-client-lifecycle-test.sh

      - name: Run front-end tests
        run: npm run test -- --run

      - name: Prepare the environment
        run: cp .env.example .env

      - name: Build client
        run: npm run build:e2e
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Check public form bundle
        run: npm run check:public-form-bundle && npm run check:built-css

      - name: Preserve client manifest for browser chunk tests
        run: |
          mkdir -p .output/qa
          cp .nuxt/dist/server/client.manifest.mjs .output/qa/client.manifest.mjs

      - name: Test built SSR configuration cache
        run: npm run test:ssr-cache:built

      - name: Upload Nuxt Output Artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nuxt-output
          path: client/.output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Build and validate Amplify Node 24 compute
        run: npm run build:amplify
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload standalone Amplify artifact
        uses: actions/upload-artifact@v7
        with:
          name: amplify-output
          path: client/.amplify-hosting
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  sync_check:
    runs-on: ubuntu-latest
    name: Verify shared files are in sync
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check file sync
        run: |
          check_sync() {
            local client_file=$1
            local api_file=$2
            
            if [ ! -f "$client_file" ]; then
              echo "❌ ERROR: Client file missing: $client_file"
              return 1
            fi
            
            if [ ! -f "$api_file" ]; then
              echo "❌ ERROR: API file missing: $api_file"
              return 1
            fi
            
            if ! diff -q "$client_file" "$api_file" > /dev/null; then
              echo "❌ ERROR: Files differ:"
              echo "   Client: $client_file"
              echo "   API:    $api_file"
              echo ""
              echo "Diff:"
              diff "$client_file" "$api_file" || true
              return 1
            else
              echo "✅ Files in sync: $client_file ↔ $api_file"
              return 0
            fi
          }
          
          failed=false
          
          check_sync "client/data/blocks_types.json" "api/resources/data/forms/blocks_types.json" || failed=true
          check_sync "client/data/forms/integrations.json" "api/resources/data/forms/integrations.json" || failed=true
          check_sync "client/test/fixtures/formula-parity-tests.json" "api/tests/fixtures/formula-parity-tests.json" || failed=true
          
          if [ "$failed" = true ]; then
            echo ""
            echo "⚠️  Some shared files are out of sync!"
            echo "Please ensure both copies are identical and commit the changes."
            exit 1
          fi
          
          echo ""
          echo "✅ All shared files are in sync!"

  tests:
    runs-on: ubuntu-latest

    name: Run Feature & Unit tests (PHP 8.3 - SQLite)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, pdo_mysql, bcmath, gd, zip, pcntl, intl
          tools: composer:v2
          coverage: none

      - name: Prepare the environment
        run: cp api/.env.example api/.env

      - name: Install composer dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Directory permissions
        working-directory: ./api
        run: chmod -R 777 storage bootstrap/cache

      - name: Run tests (Unit and Feature)
        working-directory: ./api
        run: ./vendor/bin/pest -p
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: "Archive log results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-results-sqlite
          path: api/storage/logs/laravel.log
          retention-days: 3

  database_compatibility:
    name: Database compatibility (${{ matrix.connection }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        connection: [pgsql, mysql]
        include:
          - connection: pgsql
            port: 5432
            password: postgres
          - connection: mysql
            port: 3306
            password: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: opnform_compat_pgsql
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: [5432:5432]
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: opnform_compat_mysql
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
        ports: [3306:3306]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, mbstring, pdo_pgsql, pdo_mysql, bcmath, gd, zip, intl
          tools: composer:v2
          coverage: none
      - name: Prepare isolated compatibility environment
        run: cp api/.env.example api/.env
      - name: Install Composer dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Check real PDO driver, migrate and exercise application paths
        run: php scripts/check-database-compatibility.php "${{ matrix.connection }}"
        env:
          APP_ENV: database-compatibility
          APP_KEY: base64:ZGF0YWJhc2UtY29tcGF0aWJpbGl0eS1xYS1rZXktMDA=
          APP_URL: http://localhost
          JWT_SECRET: database-compatibility-isolated-ci-only
          SELF_HOSTED: "false"
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          MAIL_FROM_ADDRESS: qa@example.test
          MAIL_FROM_NAME: Compatibility QA
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: opnform_compat_${{ matrix.connection }}
          DB_USERNAME: ${{ matrix.connection == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: ${{ matrix.password }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: database-compatibility-${{ matrix.connection }}
          path: api/storage/logs/laravel.log
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    needs: [client_checks, tests]
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install composer dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install npm dependencies
        working-directory: ./client
        run: npm ci --no-audit --no-progress --silent

      - name: Download Nuxt Output Artifact
        uses: actions/download-artifact@v8
        with:
          name: nuxt-output
          path: client/.output

      - name: Configure stable Ubuntu package mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Playwright system dependencies
        timeout-minutes: 5
        working-directory: ./client
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        timeout-minutes: 5
        working-directory: ./client
        run: npx playwright install chromium

      - name: Start E2E Stack
        run: ./scripts/e2e-up.sh

      - name: Reset E2E Database
        run: ./scripts/e2e-reset.sh

      - name: Run Playwright E2E Tests
        working-directory: ./client
        env:
          CI: true
          PLAYWRIGHT_NO_WEB_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8089
          PLAYWRIGHT_WORKERS: "2"
        shell: bash
        run: |
          set -a
          . ./.env.e2e
          set +a

          cleanup() {
            local exit_code=$?

            if [ "$exit_code" -ne 0 ]; then
              docker compose -f ../docker-compose.e2e.yml logs --no-color > ../e2e-docker.log || true
              if [ -f ../.e2e-ui.log ]; then
                cp ../.e2e-ui.log ../e2e-ui.log || true
              fi
            fi

            if [ -f ../.e2e-ui.pid ]; then
              kill "$(cat ../.e2e-ui.pid)" || true
            fi

            exit "$exit_code"
          }

          trap cleanup EXIT

          NITRO_HOST=127.0.0.1 NITRO_PORT=${NUXT_PORT:-3100} \
            node --require ./scripts/e2e-runtime-guard.cjs .output/server/index.mjs > ../.e2e-ui.log 2>&1 &
          echo $! > ../.e2e-ui.pid

          for _attempt in $(seq 1 90); do
            login_html="$(curl -fsS http://127.0.0.1:3100/login || true)"
            register_html="$(curl -fsS http://127.0.0.1:3100/register || true)"

            if printf '%s' "$login_html" | grep -q 'data-testid="login-page"' \
              && printf '%s' "$register_html" | grep -q 'data-testid="register-page"'; then
              break
            fi
            sleep 2
          done

          login_html="$(curl -fsS http://127.0.0.1:3100/login || true)"
          register_html="$(curl -fsS http://127.0.0.1:3100/register || true)"

          if ! printf '%s' "$login_html" | grep -q 'data-testid="login-page"' \
            || ! printf '%s' "$register_html" | grep -q 'data-testid="register-page"'; then
            echo "Nuxt E2E UI did not become ready for auth routes in time." >&2
            if [ -f ../.e2e-ui.log ]; then
              cat ../.e2e-ui.log >&2
            fi
            exit 1
          fi

          npm run test:e2e

      - name: Capture E2E Stack Logs
        if: ${{ failure() && !cancelled() }}
        run: |
          docker compose -f docker-compose.e2e.yml logs --no-color > e2e-docker.log
          docker compose -f docker-compose.e2e.yml exec -T api cat storage/logs/laravel.log > e2e-laravel.log || true
          if [ -f .e2e-ui.log ]; then
            cp .e2e-ui.log e2e-ui.log
          fi

      - name: Upload Playwright HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: .playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: .playwright/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E Debug Logs
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug-logs
          path: |
            e2e-docker.log
            e2e-laravel.log
            e2e-ui.log
          if-no-files-found: ignore
          retention-days: 14

  linux_client_image:
    name: Linux frontend image and health
    runs-on: ubuntu-latest
    needs: [client_checks]
    timeout-minutes: 30
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APP_ENV: image-qa
      APP_KEY: base64:ZGF0YWJhc2UtY29tcGF0aWJpbGl0eS1xYS1rZXktMDA=
      APP_URL: http://127.0.0.1:8089
      FRONT_URL: http://127.0.0.1:3100
      JWT_SECRET: isolated-linux-image-ci-only-32-byte-key
      SELF_HOSTED: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: opnform_image_qa
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MAIL_FROM_ADDRESS: qa@example.test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opnform_image_qa
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: [5432:5432]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, mbstring, pdo_pgsql, bcmath, gd, zip, intl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - name: Prepare real API for image health checks
        working-directory: api
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
          php artisan migrate --force
          php artisan db:seed --class='Database\Seeders\E2ETestSeeder' --force
          php artisan passport:keys --force
          php artisan serve --no-reload --host=127.0.0.1 --port=8089 > ../image-api.log 2>&1 &
      - name: Build Linux frontend image without publishing
        run: docker build --build-arg NODE_BUILD_HEAP_MB=4096 --iidfile client-image.id -f docker/Dockerfile.client -t opnform-client-qa .
      - name: Inspect image and exercise real SSR routes
        run: |
          docker image inspect opnform-client-qa > client-image-inspect.json
          docker run -d --name opnform-client-qa --network host --memory=1g --cpus=2 \
            -e NITRO_HOST=127.0.0.1 -e NITRO_PORT=3100 \
            -e NUXT_PUBLIC_API_BASE=http://127.0.0.1:8089 \
            -e NUXT_PRIVATE_API_BASE=http://127.0.0.1:8089 \
            -e NUXT_PUBLIC_APP_URL=http://127.0.0.1:3100 opnform-client-qa
          docker exec opnform-client-qa node -e 'if(process.platform!=="linux"||process.version!=="v24.22.1")process.exit(1);console.log(JSON.stringify({platform:process.platform,node:process.version}))' | tee client-image-runtime.json
          docker cp client/scripts/check-built-css.mjs opnform-client-qa:/tmp/check-built-css.mjs
          docker exec opnform-client-qa node /tmp/check-built-css.mjs /app/public
          node scripts/check-linux-client-health.mjs
      - uses: actions/download-artifact@v8
        with:
          name: amplify-output
          path: ${{ runner.temp }}/opnform-amplify-qa
      - name: Smoke standalone Amplify compute on Linux Node 24
        run: node scripts/check-amplify-runtime.mjs "${{ runner.temp }}/opnform-amplify-qa"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: amplify-runtime-evidence
          path: |
            amplify-runtime*.json
            amplify-runtime.log
          retention-days: 7
      - name: Capture image and API logs
        if: always()
        run: docker logs opnform-client-qa > client-image.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-client-image-evidence
          path: |
            client-image*.json
            client-image.id
            client-image.log
            image-api.log
            api/storage/logs/laravel.log
          retention-days: 7

  dependency-security:
    uses: ./.github/workflows/dependency-security.yml
    permissions:
      contents: read

  release-readiness:
    name: Release readiness
    if: always()
    needs: [code_lint, client_checks, sync_check, tests, database_compatibility, e2e, linux_client_image, dependency-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
      - name: Require every security and QA job
        run: node scripts/check-ci-readiness.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  production-deploy:
    needs: [release-readiness]
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Triggers Deployment (Vapor & Amplify)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, pdo_mysql, bcmath, gd, zip, pcntl, intl
          tools: composer:v2
          coverage: none

      - name: Prepare the environment
        working-directory: ./api
        run: cp .env.example .env

      - name: Install composer dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: Directory permissions
        working-directory: ./api
        run: chmod -R 777 storage bootstrap/cache

      - name: Trigger front-end deployment
        run: |
          URL="${{ secrets.AMPLIFY_DEPLOY_URL }}"
          curl -X POST -d {} "$URL" -H "Content-Type: application/json"

      - name: Created encrypted .env file before deployment
        working-directory: ./api
        run: |
          echo "${{ secrets.ENCRYPTED_ENV_FILE }}" >> .env.production.encrypted

      - name: Deploy back-end to production
        working-directory: ./api
        run: php vendor/bin/vapor deploy api-production --commit="${GITHUB_SHA}" --message="${GITHUB_REF}"
        env:
          VAPOR_API_TOKEN: ${{ secrets.VAPOR_API_TOKEN }}

  publish-docker-images:
    name: Push Docker images to Docker Hub
    needs: [release-readiness]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get version info
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            {
              echo "VERSION=${GITHUB_REF#refs/*/v}"
              echo "API_TAGS=${{secrets.DOCKER_API_REPO}}:latest,${{secrets.DOCKER_API_REPO}}:${GITHUB_REF#refs/*/v}"
              echo "UI_TAGS=${{secrets.DOCKER_UI_REPO}}:latest,${{secrets.DOCKER_UI_REPO}}:${GITHUB_REF#refs/*/v}"
            } >> "$GITHUB_ENV"
          fi

      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_ENV=${{ env.VERSION == 'dev' && 'local' || 'production' }}
            COMPOSER_FLAGS=${{ env.VERSION == 'dev' && '--optimize-autoloader --no-interaction' || '--no-dev --optimize-autoloader --no-interaction' }}
            APP_VERSION=${{ env.VERSION }}
          tags: ${{ env.API_TAGS }}
          cache-from: type=registry,ref=${{secrets.DOCKER_API_REPO}}:dev
          cache-to: type=inline

      - name: Build and push Client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: ${{ env.UI_TAGS }}
          cache-from: type=registry,ref=${{secrets.DOCKER_UI_REPO}}:dev
          cache-to: type=inline
