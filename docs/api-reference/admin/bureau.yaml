# Configure a real non-admin test user ID before importing this connection.
version: 1
baseUrl: https://api.opnform.com
auth:
  type: bearer
test:
  operation: user_get
  input:
    identifier: "42"
operations:
  user_get:
    kind: read
    title: User get
    description: Read current admin data.
    input:
      identifier: {type: string}
    request:
      method: GET
      path: /external/admin/v1/users/{{input.identifier}}
    output:
      id: id
      email: email
      blocked: blocked
      two_factor_enabled: two_factor_enabled
      workspaces: workspaces
  workspace_get:
    kind: read
    title: Workspace get
    description: Read current admin data.
    input:
      workspace_id: {type: integer}
    request:
      method: GET
      path: /external/admin/v1/workspaces/{{input.workspace_id}}
    output:
      id: id
      name: name
      plan: plan
      forms_count: forms_count
  deleted_forms:
    kind: read
    title: Deleted forms
    description: Read current admin data.
    input:
      user_id: {type: integer}
    request:
      method: GET
      path: /external/admin/v1/users/{{input.user_id}}/deleted-forms
    output:
      forms: forms
  billing_customer:
    kind: read
    title: Billing customer
    description: Read current admin data.
    input:
      user_id: {type: integer}
    request:
      method: GET
      path: /external/admin/v1/users/{{input.user_id}}/billing/customer
    output:
      billing_email: billing_email
      billing_name: billing_name
  billing_subscriptions:
    kind: read
    title: Billing subscriptions
    description: Read current admin data.
    input:
      user_id: {type: integer}
    request:
      method: GET
      path: /external/admin/v1/users/{{input.user_id}}/billing/subscriptions
    output:
      subscriptions: subscriptions
  billing_payments:
    kind: read
    title: Billing payments
    description: Read current admin data.
    input:
      user_id: {type: integer}
    request:
      method: GET
      path: /external/admin/v1/users/{{input.user_id}}/billing/payments
    output:
      payments: payments
  user_block_status:
    kind: read
    title: Check block-user
    description: Read before proposing; copy snapshot_hash to expected_state and keep the same action_id.
    input:
      action_id: {type: string}
      user_id: {type: integer}
    request:
      method: GET
      path: "/external/admin/v1/actions/{{input.action_id}}?operation=block-user&user_id={{input.user_id}}"
    output:
      action_id: action_id
      operation: operation
      target: target
      status: status
      snapshot_hash: snapshot_hash
      state: state
      result: result
  user_block:
    kind: action
    title: Block user
    description: Requires admin:users:block. Execute only after the user approves the exact parameters.
    input:
      action_id: {type: string}
      expected_state: {type: string}
      user_id: {type: integer}
      reason: {type: string}
    request:
      method: POST
      path: /external/admin/v1/actions/block-user
      body:
        action_id: '{{input.action_id}}'
        expected_state: '{{input.expected_state}}'
        user_id: '{{input.user_id}}'
        reason: '{{input.reason}}'
    idempotencyHeader: Idempotency-Key
    verify:
      operation: user_block_status
      expect:
        action_id: '{{input.action_id}}'
        operation: block-user
        status: completed
  user_unblock_status:
